# ==============================================
# ============= 🟢 HERRAMIENTA =================
# ==============================================
# Capa 4 — Herramienta
# Si un servicio de esta capa cae, solo pierdes
# conveniencia. Nada crítico depende de ello.
#
# Servicios:
#   - pgadmin     (administrador gráfico de postgres)
#   - phpadmin    (administrador de mariadb)
#   - pgbackup    (backups automáticos de postgres)
#   - vaultwarden (gestor de contraseñas)
# ==============================================

services:
  # --- pgAdmin (administrador web para Postgres) ---
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.${DOMINIO}`)"
      - "traefik.http.routers.pgadmin.entrypoints=web"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"

  # --- phpMyAdmin (administrador de MariaDB) ---
  phpadmin:
    image: phpmyadmin
    container_name: phpadmin
    restart: always
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MARIA_ROOT_PASS}
      MYSQL_USER: mariadb
      MYSQL_PASSWORD: ${MARIA_PASS}
      PMA_ARBITRARY: 1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.phpmyadmin.rule=Host(`phpdb.${DOMINIO}`)"
      - "traefik.http.routers.phpmyadmin.entrypoints=web"
      - "traefik.http.services.phpmyadmin.loadbalancer.server.port=80"

  # --- pgBackup (backups automáticos de Postgres) ---
  pgbackup:
    image: prodrigestivill/postgres-backup-local
    container_name: pgbackup
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_HOST: ${BACKUP_HOST}
      POSTGRES_DB: ${BACKUP_DATABASE}
      POSTGRES_USER: ${BACKUP_USER}
      POSTGRES_PASSWORD: ${BACKUP_PASSWORD}
      SCHEDULE: "@daily"
      COMPRESSION: "gzip"
      BACKUP_KEEP_DAYS: 2
      BACKUP_KEEP_WEEKS: 2
      BACKUP_KEEP_MONTHS: 1
    volumes:
      - ./data/backups:/backups

  # --- Vaultwarden (gestor de contraseñas) ---
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      DATABASE_URL: ${VAULTWARDEN_DATABASE_URL}
      WEBSOCKET_ENABLED: ${VAULTWARDEN_WEBSOCKET_ENABLED}
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
    volumes:
      - ./data/vaultwarden:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.middlewares=cloudflare-https@file"
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.${DOMINIO}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=web"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
      - "com.centurylinklabs.watchtower.enable=true"
