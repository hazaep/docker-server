# ==============================================
# oikb — Knowledge Base Sync Configuration
# ==============================================
# Copy this file to ./data/oikb/.oikb.yaml
# Variables use ${VAR} or ${VAR:-default} syntax,
# resolved from the container environment at runtime.
# ==============================================

defaults:
  interval: 30m
  concurrency: 2
  filter:
    max-size: 50mb
    include: ["**.md", "**.html"]

sources:
  # --- Bildung Codex ---
  # Syncs the Codex (7 Escuelas, investigación, ontología)
  # into its own Knowledge Base so the LLM has full context.
  - name: codex
    source: "/sync/Obsidian/Mi Mente/Bildung/Lab/codex"
    kb-id: ${KB_CODEX_ID}

  # --- n8n documentation ---
  - name: n8n-docs
    source: "/sync/repos/n8n-docs"
    kb-id: ${KB_N8N_DOCS_ID}

  # --- docker-server ---
  - name: docker-server
    source: "/sync/Obsidian/Mi Mente/Bildung/Lab/docker-server"
    kb-id: ${KB_DOCKER_SERVER_ID}

  # --- Obsidian vault ---
  # Uncomment and configure when your vault is synced to the Pi.
  # - name: obsidian-vault
  #   source: /sync/obsidian-vault
  #   kb-id: ${KB_OBSIDIAN_ID}
  #   filter:
  #     include: ["**.md"]
  #     exclude: [".obsidian/**", ".trash/**", "_templates/**"]
